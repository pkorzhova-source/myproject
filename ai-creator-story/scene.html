<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Inter Display", "Inter", sans-serif; color: #fff; background: #070b18; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  .grid { position: absolute; inset: -200px; opacity: .14;
    background-image: linear-gradient(rgba(140,170,255,.5) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(140,170,255,.5) 1px, transparent 1px);
    background-size: 90px 90px; }
  .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(4,6,14,.85) 100%); }

  .scene { position: absolute; left: 0; right: 0; top: 300px; height: 980px; display: flex; flex-direction: column;
           align-items: center; justify-content: center; text-align: center; padding: 0 80px; opacity: 0; }
  .label { font-size: 38px; font-weight: 600; letter-spacing: 8px; text-transform: uppercase; color: #7fd6ff; }
  .mega { font-size: 176px; font-weight: 900; letter-spacing: -5px; line-height: 1; }
  .accent { background: linear-gradient(95deg, #5ee0ff 0%, #8b7bff 50%, #e07bff 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 50px; font-weight: 500; color: #b9c3e6; line-height: 1.35; }
  .line { width: 0; height: 4px; margin: 46px auto; border-radius: 2px; background: linear-gradient(90deg, #5ee0ff, #e07bff); }

  .cards { display: flex; gap: 30px; margin-top: 60px; }
  .card { width: 280px; height: 320px; border-radius: 40px; background: rgba(255,255,255,.05);
          border: 2px solid rgba(140,170,255,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  .card svg { width: 120px; height: 120px; }
  .card span { font-size: 42px; font-weight: 700; }
  .ai { margin-top: 56px; display: inline-flex; align-items: center; gap: 22px; padding: 26px 50px; border-radius: 999px;
        background: linear-gradient(95deg, rgba(94,224,255,.18), rgba(224,123,255,.18)); border: 2px solid rgba(160,170,255,.5);
        font-size: 42px; font-weight: 700; white-space: nowrap; }
  .ai svg { width: 54px; height: 54px; }

  .split { display: flex; flex-direction: column; gap: 34px; width: 900px; }
  .panel { border-radius: 40px; padding: 46px 56px; text-align: left; border: 2px solid rgba(140,170,255,.22); background: rgba(255,255,255,.04); }
  .panel.me { background: linear-gradient(135deg, rgba(94,224,255,.12), rgba(224,123,255,.14)); border-color: rgba(170,160,255,.55); }
  .panel .k { font-size: 36px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase; color: #8b97c4; }
  .panel .v { font-size: 74px; font-weight: 800; margin-top: 10px; letter-spacing: -1px; }
  .tags { display: flex; gap: 20px; margin-top: 26px; }
  .tag { padding: 18px 34px; border-radius: 999px; font-size: 44px; font-weight: 700; background: rgba(255,255,255,.1); }

  #cap { position: absolute; left: 70px; right: 70px; top: 1360px; height: 260px; display: flex; align-items: center; justify-content: center; }
  #capbox { padding: 26px 40px; border-radius: 28px; background: rgba(5,8,20,.55); border: 1px solid rgba(255,255,255,.08);
            font-size: 54px; font-weight: 700; line-height: 1.3; text-align: center; }
  #capbox .w { color: rgba(255,255,255,.45); }
  #capbox .w.on { color: #fff; }
  #capbox .w.now { color: #7fe3ff; }
  .bars { position: absolute; left: 50%; top: 1660px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; height: 70px; }
  .bars i { display: block; width: 10px; border-radius: 5px; background: linear-gradient(#5ee0ff, #e07bff); }
</style>
</head>
<body>
<div id="bg">
  <div class="grid" id="grid"></div>
  <div class="glow" id="g1" style="width:900px;height:900px;background:#3a2bd6;opacity:.55"></div>
  <div class="glow" id="g2" style="width:760px;height:760px;background:#0ea5d8;opacity:.45"></div>
  <div class="glow" id="g3" style="width:620px;height:620px;background:#b03fd6;opacity:.35"></div>
  <div class="vignette"></div>
</div>

<section class="scene" id="s1">
  <div class="label" data-a="0.15">Чим я займаюсь</div>
  <div class="line" id="l1"></div>
  <div class="mega" data-a="0.55"><span class="accent">AI</span>-креатор</div>
</section>

<section class="scene" id="s2">
  <div class="label" data-a="0.05">Створюю</div>
  <div class="cards">
    <div class="card" data-at="3.29">
      <svg viewBox="0 0 48 48" fill="none" stroke="#7fe3ff" stroke-width="3" stroke-linejoin="round"><rect x="5" y="10" width="38" height="28" rx="6"/><path d="M21 18l9 6-9 6z" fill="#7fe3ff"/></svg>
      <span>Відео</span></div>
    <div class="card" data-at="3.91">
      <svg viewBox="0 0 48 48" fill="none" stroke="#a99bff" stroke-width="3" stroke-linejoin="round"><rect x="5" y="8" width="38" height="32" rx="6"/><circle cx="17" cy="18" r="4"/><path d="M7 36l12-11 8 7 6-5 10 9"/></svg>
      <span>Зображення</span></div>
    <div class="card" data-at="4.96">
      <svg viewBox="0 0 48 48" fill="none" stroke="#e59bff" stroke-width="3" stroke-linecap="round"><path d="M10 12h28M10 20h28M10 28h28M10 36h16"/></svg>
      <span>Тексти</span></div>
  </div>
  <div class="ai" data-at="5.9">
    <svg viewBox="0 0 48 48"><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#5ee0ff"/><stop offset="1" stop-color="#e07bff"/></linearGradient></defs>
      <path fill="url(#sg)" d="M24 3c1.6 9.4 5.6 13.4 15 15-9.4 1.6-13.4 5.6-15 15-1.6-9.4-5.6-13.4-15-15 9.4-1.6 13.4-5.6 15-15z"/>
      <path fill="url(#sg)" d="M39 30c.8 4.4 2.6 6.2 7 7-4.4.8-6.2 2.6-7 7-.8-4.4-2.6-6.2-7-7 4.4-.8 6.2-2.6 7-7z"/></svg>
    за допомогою штучного інтелекту</div>
</section>

<section class="scene" id="s3">
  <div class="split">
    <div class="panel" data-at="8.1">
      <div class="k">Нейромережі</div>
      <div class="v">мій інструмент</div>
    </div>
    <div class="panel me" data-at="10.4">
      <div class="k">Завжди за мною</div>
      <div class="tags">
        <div class="tag" data-at="10.62">ідея</div>
        <div class="tag" data-at="11.2">сенс</div>
        <div class="tag" data-at="11.94">якість</div>
      </div>
    </div>
  </div>
</section>

<div id="cap"><div id="capbox"></div></div>
<div class="bars" id="bars"></div>

<script>
const DUR = 15, OFF = 0.4;          // voice starts at 0.4s
window.WORDS = [];                   // injected: [{w,s,e}]
const scenes = [["s1", 0, 2.55], ["s2", 2.55, 8.05], ["s3", 8.05, 15]];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const bars = document.getElementById("bars");
for (let i = 0; i < 24; i++) bars.appendChild(document.createElement("i"));

let chunks = null;
function buildChunks() {             // caption phrases split by meaning (word indices)
  const cuts = [3, 9, 13, 17, 23];
  chunks = []; let a = 0;
  for (const c of [...cuts, WORDS.length]) { chunks.push(WORDS.slice(a, c)); a = c; }
}

window.render = function (t) {
  if (!chunks) buildChunks();
  // background
  document.getElementById("grid").style.transform = `translateY(${(t * 18) % 90}px) perspective(900px) rotateX(18deg)`;
  const pos = (id, x, y, r, sp, ph) => { const el = document.getElementById(id);
    el.style.left = (x + Math.cos(t * sp + ph) * r) + "px"; el.style.top = (y + Math.sin(t * sp * 1.2 + ph) * r) + "px"; };
  pos("g1", -250, 150, 160, 0.4, 0); pos("g2", 450, 900, 200, 0.33, 2); pos("g3", -150, 1250, 150, 0.45, 4);

  // scenes
  for (const [id, a, b] of scenes) {
    const el = document.getElementById(id), L = t - a;
    const fin = a === 0 ? 1 : ease(L / 0.35);
    const fout = b === DUR ? 1 - ease((t - (b - 0.6)) / 0.6) : 1 - ease((t - (b - 0.3)) / 0.3);
    el.style.opacity = (t >= a && t < b + 0.01) ? Math.min(fin, fout) : 0;
    el.style.transform = `scale(${1 + 0.03 * clamp(L / (b - a))})`;
    el.querySelectorAll("[data-a]").forEach(n => { const k = ease((L - +n.dataset.a) / 0.5);
      n.style.opacity = k; n.style.transform = `translateY(${(1 - k) * 50}px)`; });
    el.querySelectorAll("[data-at]").forEach(n => { const x = (t - (+n.dataset.at + OFF - 0.12)) / 0.45;
      n.style.opacity = clamp(x * 2); n.style.transform = `translateY(${(1 - ease(x)) * 40}px) scale(${x <= 0 ? .85 : 0.85 + 0.15 * back(x)})`; });
  }
  document.getElementById("l1").style.width = (ease((t - 0.3) / 0.7) * 300) + "px";

  // captions
  const vt = t - OFF, box = document.getElementById("capbox");
  let ci = -1;
  chunks.forEach((c, i) => { if (vt >= c[0].s - 0.05) ci = i; });
  const last = chunks[chunks.length - 1];
  if (ci < 0 || vt > last[last.length - 1].e + 0.6) { box.style.opacity = 0; }
  else {
    box.style.opacity = 1;
    box.innerHTML = chunks[ci].map(w => `<span class="w ${vt >= w.e ? "on" : vt >= w.s ? "now" : ""}">${w.w}</span>`).join(" ");
  }
  // voice-reactive bars (driven by word timing)
  const speaking = WORDS.some(w => vt >= w.s && vt <= w.e);
  [...bars.children].forEach((b, i) => {
    const amp = speaking ? 0.35 + 0.65 * Math.abs(Math.sin(t * 9 + i * 0.9) * Math.cos(t * 5.3 + i * 0.4)) : 0.12;
    b.style.height = (10 + amp * 60) + "px"; b.style.opacity = speaking ? 1 : 0.4;
  });
  bars.style.opacity = t > DUR - 0.6 ? 1 - ease((t - (DUR - 0.6)) / 0.6) : 1;
  document.getElementById("cap").style.opacity = bars.style.opacity;
};
</script>
</body>
</html>
