<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1920, H = 1080, DUR = 20;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
let seed = 20261224;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG = new THREE.Color().setRGB(0.10, 0.10, 0.24);
scene.fog = new THREE.FogExp2(FOG, 0.0105);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.3, 1200);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.16;

// ---------- materials ----------
const matCache = new Map();
function M(color, o = {}) {
  const k = color + JSON.stringify(o);
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color, roughness: 0.82, ...o }));
  return matCache.get(k);
}
const glowCache = new Map();
function G(r, g, b) {
  const k = [r, g, b].join();
  if (!glowCache.has(k)) glowCache.set(k, new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(r, g, b) }));
  return glowCache.get(k);
}
const snowMat = M(0xf1f5fc, { roughness: 0.95 });
const roofMat = M(0x2a2a31);
const woodDark = M(0x5a3a22);
const wood = M(0x8a5a32);
const woodLight = M(0xa87445);
const frameMat = M(0xf2ece0);
const goldMat = M(0xd8a943, { metalness: 0.85, roughness: 0.3, emissive: 0x3a2400 });
const ironMat = M(0x1d2028, { metalness: 0.5, roughness: 0.5 });
const glassDark = M(0x141a2a, { roughness: 0.2 });
const WARM = [G(2.4, 1.45, 0.6), G(2.1, 1.15, 0.45), G(1.6, 1.05, 0.6), G(2.6, 1.7, 0.85)];
const pineMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, flatShading: true });

function radialTex(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); return t;
}
const poolTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const poolCache = new Map();
function poolMat(r, g, b) {
  const k = [r, g, b].join();
  if (!poolCache.has(k)) poolCache.set(k, new THREE.MeshBasicMaterial({
    map: poolTex, color: new THREE.Color().setRGB(r, g, b), transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }));
  return poolCache.get(k);
}

// ---------- helpers ----------
const staticRoot = new THREE.Group(); scene.add(staticRoot);
function mesh(geo, mat, parent, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); parent.add(m); return m;
}
const box = (p, w, h, d, mat, x, y, z, rx, ry, rz) => mesh(new THREE.BoxGeometry(w, h, d), mat, p, x, y, z, rx, ry, rz);
function pool(p, x, z, sx, sz, r, g, b) {
  r *= 0.5; g *= 0.5; b *= 0.5;
  const m = mesh(new THREE.PlaneGeometry(sx, sz), poolMat(r, g, b), p, x, 0.04, z, -Math.PI / 2); return m;
}
// bulbs are markers resolved to world-space instances later
function bulb(parent, x, y, z, col, size = 0.065, tw = 0) {
  const o = new THREE.Object3D(); o.position.set(x, y, z); o.userData.bulb = { col, size, tw }; parent.add(o); return o;
}
const PAL = {
  warm: [2.8, 1.85, 0.8], gold: [3.0, 1.9, 0.55], red: [3.2, 0.35, 0.25], green: [0.35, 2.6, 0.6],
  blue: [0.45, 0.9, 3.4], pink: [3.0, 0.6, 1.6], white: [2.6, 2.5, 2.3]
};
const multi = () => PAL[pick(['red', 'green', 'blue', 'gold', 'pink', 'gold'])];
function garland(parent, a, b, sag, spacing, colFn, size = 0.06) {
  const n = Math.max(2, Math.round(a.distanceTo(b) / spacing));
  for (let i = 0; i <= n; i++) {
    const u = i / n; const p = a.clone().lerp(b, u); p.y -= sag * 4 * u * (1 - u);
    bulb(parent, p.x, p.y, p.z, colFn(i), size, rnd() < 0.35 ? rr(1.5, 4) : 0);
  }
}
function scallop(parent, x0, x1, y, z, sag, per, colFn) {
  const n = Math.round((x1 - x0) / 0.32);
  for (let i = 0; i <= n; i++) {
    const u = i / n; const x = x0 + (x1 - x0) * u; const k = (u * per) % 1;
    bulb(parent, x, y - sag * 4 * k * (1 - k), z, colFn(i), 0.06, rnd() < 0.3 ? rr(1.5, 4) : 0);
  }
}

// ---------- pine geometry (vertex coloured, snow dusted) ----------
const hash3 = (x, y, z) => { const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453; return s - Math.floor(s); };
function pineGeom(h, r, tiers, snowAmt, dark = 0, segs = 10, jit = 0.28) {
  const parts = [];
  const gA = new THREE.Color(0x14301f), gB = new THREE.Color(0x1f4630), sC = new THREE.Color(0xe9eff8), tr = new THREE.Color(0x3b2717);
  const trunk = new THREE.CylinderGeometry(h * 0.03, h * 0.04, h * 0.25, 6).toNonIndexed();
  trunk.translate(0, h * 0.12, 0);
  const tc = []; for (let i = 0; i < trunk.attributes.position.count; i++) tc.push(tr.r, tr.g, tr.b);
  trunk.setAttribute('color', new THREE.Float32BufferAttribute(tc, 3)); parts.push(trunk);
  for (let i = 0; i < tiers; i++) {
    const f = i / (tiers - 1);
    const rad = r * (1 - f * 0.78), ch = h * (0.42 - f * 0.12), y = h * 0.16 + f * h * 0.64 + ch / 2;
    const c = new THREE.ConeGeometry(rad, ch, segs, 2).toNonIndexed();
    c.translate(0, y, 0);
    const p = c.attributes.position;
    for (let v = 0; v < p.count; v++) {
      const X = p.getX(v), Y = p.getY(v), Z = p.getZ(v);
      const k = hash3(Math.round(X * 50) + i * 7, Math.round(Y * 50), Math.round(Z * 50));
      const rr2 = Math.hypot(X, Z);
      if (rr2 > 1e-3) { const s = 1 + (k - 0.5) * jit; p.setX(v, X * s); p.setZ(v, Z * s); }
      p.setY(v, Y + (k - 0.5) * ch * 0.08);
    }
    const col = [];
    for (let t = 0; t < p.count; t += 3) {
      const cy = (p.getY(t) + p.getY(t + 1) + p.getY(t + 2)) / 3;
      const local = (cy - (y - ch / 2)) / ch;
      const isCap = Math.abs(p.getY(t) - p.getY(t + 1)) < 1e-4 && Math.abs(p.getY(t) - p.getY(t + 2)) < 1e-4 && local < 0.1;
      let c3 = rnd() < 0.5 ? gA : gB;
      if (!isCap && rnd() < snowAmt * (0.45 + local)) c3 = sC;
      if (dark) c3 = c3.clone().multiplyScalar(1 - dark);
      for (let q = 0; q < 3; q++) col.push(c3.r, c3.g, c3.b);
    }
    c.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    c.computeVertexNormals();
    parts.push(c);
  }
  parts.forEach(g => g.deleteAttribute('uv'));
  return mergeGeometries(parts);
}
const pineVariants = [pineGeom(1, 0.36, 5, 0.5), pineGeom(1, 0.32, 6, 0.6), pineGeom(1, 0.4, 5, 0.4), pineGeom(1, 0.3, 4, 0.55)];
function pine(parent, x, z, h, ry = rnd() * 6.28) {
  const m = mesh(pick(pineVariants), pineMat, parent, x, 0, z, 0, ry, 0); m.scale.setScalar(h); return m;
}
function litTree(parent, x, z, h, colFn) {
  const g = new THREE.Group(); g.position.set(x, 0, z); parent.add(g);
  pine(g, 0, 0, h);
  const n = Math.round(h * 26);
  for (let i = 0; i < n; i++) {
    const u = i / n; const y = h * (0.2 + u * 0.74); const R = h * 0.36 * (1 - u * 0.95) + 0.05;
    const a = u * Math.PI * 2 * 5.5;
    bulb(g, Math.sin(a) * R, y, Math.cos(a) * R, colFn(i), 0.055, rnd() < 0.4 ? rr(1.5, 4) : 0);
  }
  bulb(g, 0, h * 1.02, 0, PAL.gold, 0.12);
  return g;
}

// ---------- gable roof ----------
function gableRoof(g, w, d, baseY, a, over, wallMat) {
  const hs = d / 2 + over, L = hs / Math.cos(a) + 0.05, rise = hs * Math.tan(a);
  for (const s of [-1, 1]) {
    const r = box(g, w + over * 1.6, 0.2, L, roofMat, 0, baseY + rise / 2 - over * Math.tan(a) / 2 + 0.05, s * hs / 2, s * a);
    const nY = Math.cos(a), nZ = s * Math.sin(a);
    const sn = box(g, w + over * 1.6 + 0.08, 0.22, L + 0.04, snowMat, r.position.x, r.position.y + nY * 0.2, r.position.z + nZ * 0.2, s * a);
  }
  // attic prism
  const sh = new THREE.Shape(); const ah = (d / 2) * Math.tan(a);
  sh.moveTo(-d / 2, 0); sh.lineTo(d / 2, 0); sh.lineTo(0, ah); sh.closePath();
  const pr = new THREE.ExtrudeGeometry(sh, { depth: w, bevelEnabled: false });
  mesh(pr, wallMat, g, -w / 2, baseY, 0, 0, Math.PI / 2, 0);
  return { eaveY: baseY - over * Math.tan(a) + 0.02, eaveZ: hs, ridgeY: baseY + rise - over * Math.tan(a) };
}

// ---------- houses ----------
const houseColors = [0x8e2a22, 0xa8382a, 0xc9902e, 0x2f5a45, 0x2a4263, 0xe6dcc6, 0x7d97ab, 0x9a5b3a, 0xd8c08f, 0x6b2a3a];
function makeHouse(w, d, h, color) {
  const g = new THREE.Group();
  const wall = M(color, { roughness: 0.85 });
  box(g, w, h, d, wall, 0, h / 2, 0);
  box(g, w + 0.1, 0.35, d + 0.1, M(0x4a4a52), 0, 0.17, 0); // plinth
  const roof = gableRoof(g, w, d, h, 0.68, 0.55, wall);
  // corner boards
  for (const s of [-1, 1]) box(g, 0.16, h, 0.16, frameMat, s * (w / 2 - 0.02), h / 2, d / 2 + 0.02);
  // windows
  const floors = h > 7.1 ? 3 : (h > 5.2 ? 2 : 1);
  const cols = Math.max(2, Math.floor(w / 1.7));
  const doorCol = Math.floor(rnd() * cols);
  for (let f = 0; f < floors; f++) {
    for (let c = 0; c < cols; c++) {
      const x = -w / 2 + (c + 0.5) * (w / cols);
      const y = 1.55 + f * 2.25;
      if (f === 0 && c === doorCol) {
        box(g, 1.15, 2.2, 0.12, frameMat, x, 1.15, d / 2 + 0.03);
        box(g, 0.95, 2.05, 0.12, M(pick([0x5a3a22, 0x2e4a3a, 0x6a2020])), x, 1.1, d / 2 + 0.07);
        const wr = mesh(new THREE.TorusGeometry(0.23, 0.08, 6, 14), M(0x1f5a2e), g, x, 1.55, d / 2 + 0.16);
        box(g, 0.14, 0.12, 0.06, M(0xc01818), x, 1.33, d / 2 + 0.2);
        box(g, 0.14, 0.2, 0.14, ironMat, x + 0.75, 2.05, d / 2 + 0.1);
        box(g, 0.09, 0.14, 0.15, WARM[3], x + 0.75, 2.04, d / 2 + 0.11);
        pool(g, x, d / 2 + 1.4, 3, 2.4, 0.35, 0.22, 0.1);
        // snow pile by door
        continue;
      }
      const ww = 0.9, wh = 1.2;
      box(g, ww + 0.16, wh + 0.16, 0.08, frameMat, x, y, d / 2 + 0.03);
      const lit = rnd() < 0.82;
      box(g, ww, wh, 0.05, lit ? pick(WARM) : glassDark, x, y, d / 2 + 0.06);
      box(g, 0.06, wh, 0.03, frameMat, x, y, d / 2 + 0.1);
      box(g, ww, 0.06, 0.03, frameMat, x, y + 0.12, d / 2 + 0.1);
      box(g, ww + 0.3, 0.1, 0.25, frameMat, x, y - wh / 2 - 0.1, d / 2 + 0.12);
      box(g, ww + 0.26, 0.09, 0.22, snowMat, x, y - wh / 2 - 0.02, d / 2 + 0.13);
      if (lit && f === 0) pool(g, x, d / 2 + 1.6, 2.4, 2.6, 0.22, 0.14, 0.06);
      // shutters
      if (color !== 0xe6dcc6 && rnd() < 0.5) for (const s of [-1, 1]) box(g, 0.28, wh + 0.1, 0.05, frameMat, x + s * (ww / 2 + 0.25), y, d / 2 + 0.04);
    }
  }
  // chimney
  const chx = rr(-w / 3, w / 3);
  box(g, 0.6, 1.6, 0.6, M(0x5d3b30), chx, roof.ridgeY - 0.2, -d * 0.15);
  box(g, 0.72, 0.18, 0.72, snowMat, chx, roof.ridgeY + 0.66, -d * 0.15);
  // garland under front eave
  const style = rnd();
  const cf = style < 0.55 ? () => PAL.warm : (style < 0.8 ? () => multi() : () => (rnd() < 0.5 ? PAL.gold : PAL.red));
  scallop(g, -w / 2 - 0.4, w / 2 + 0.4, roof.eaveY - 0.06, roof.eaveZ + 0.02, 0.22, Math.round(w / 1.2), cf);
  // roof edge light line (gable outline on front side)
  if (rnd() < 0.4) garland(g, V3(-w / 2 - 0.45, roof.eaveY + 0.1, roof.eaveZ * 0.98), V3(w / 2 + 0.45, roof.eaveY + 0.1, roof.eaveZ * 0.98), 0, 0.3, cf);
  // window-box snow drift at base
  for (let i = 0; i < 3; i++) mesh(new THREE.SphereGeometry(1, 10, 6), snowMat, g, rr(-w / 2, w / 2), 0, d / 2 + 0.3, 0, 0, 0).scale.set(rr(0.6, 1.2), rr(0.25, 0.4), 0.45);
  return g;
}

// ---------- street layout ----------
const cx = z => z > 24 ? 4 * Math.sin((z - 24) / 25) : 0;
const dcx = z => z > 24 ? (4 / 25) * Math.cos((z - 24) / 25) : 0;
function frameAt(z) { const T = V3(dcx(z), 0, 1).normalize(); return { P: V3(cx(z), 0, z), T, N: V3(T.z, 0, -T.x) }; }
function placeOnStreet(obj, z, side, off, faceStreet = true) {
  const { P, N } = frameAt(z);
  obj.position.copy(P).addScaledVector(N, side * off);
  const f = side > 0 ? V3(-N.x, 0, -N.z) : V3(N.x, 0, N.z);
  obj.rotation.y = Math.atan2(f.x, f.z);
  if (!faceStreet) obj.rotation.y += Math.PI;
  return obj;
}

// ground
const ground = mesh(new THREE.PlaneGeometry(1200, 1200), snowMat, scene, 0, 0, 0, -Math.PI / 2);
{ // trodden street ribbon
  const pos = [], idx = []; let n = 0;
  for (let z = 22; z <= 200; z += 1) {
    const { P, N } = frameAt(z);
    const a = P.clone().addScaledVector(N, -6.8), b = P.clone().addScaledVector(N, 6.8);
    pos.push(a.x, 0.02, a.z, b.x, 0.02, b.z);
    if (n) idx.push(n * 2 - 2, n * 2, n * 2 - 1, n * 2 - 1, n * 2, n * 2 + 1);
    n++;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const uv = new Float32Array(pos.length / 3 * 2); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  mesh(g, M(0xd2dae6, { roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }), staticRoot);
  mesh(new THREE.CircleGeometry(24, 64), M(0xdce2ec, { roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }), staticRoot, 0, 0.02, 0, -Math.PI / 2);
}

for (const side of [-1, 1]) {
  let z = 150;
  while (z > 31) {
    const w = rr(5.2, 7.6), d = rr(5.5, 7), h = rr(4.8, 7.8);
    if (z - w < 29) break;
    const hs = makeHouse(w, d, h, pick(houseColors));
    placeOnStreet(hs, z - w / 2, side, 8.6 + d / 2);
    staticRoot.add(hs);
    z -= w + rr(0.8, 1.8);
    if (rnd() < 0.45 && z > 36) {
      const tg = new THREE.Group(); placeOnStreet(tg, z - 1.3, side, 8.2); staticRoot.add(tg);
      litTree(tg, 0, 0, rr(2.4, 3.6), rnd() < 0.5 ? () => PAL.warm : () => multi());
      z -= 2.8;
    }
  }
}
// forest behind houses
for (let i = 0; i < 260; i++) {
  const z = rr(20, 175), side = rnd() < 0.5 ? -1 : 1, off = rr(17, 48);
  const o = new THREE.Object3D(); placeOnStreet(o, z, side, off);
  if (Math.hypot(o.position.x, o.position.z) < 30) continue;
  pine(staticRoot, o.position.x, o.position.z, rr(7, 15));
}
// snow banks along street
for (let z = 28; z < 160; z += rr(1.5, 3)) for (const side of [-1, 1]) {
  const o = new THREE.Object3D(); placeOnStreet(o, z, side, rr(6.9, 7.6));
  mesh(new THREE.SphereGeometry(1, 10, 6), snowMat, staticRoot, o.position.x, 0, o.position.z).scale.set(rr(0.7, 1.4), rr(0.3, 0.5), rr(0.6, 1.2));
}
// street lamps
function makeLamp(parent) {
  const g = new THREE.Group(); parent.add(g);
  mesh(new THREE.CylinderGeometry(0.07, 0.11, 3.8, 8), ironMat, g, 0, 1.9, 0);
  mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.3, 8), ironMat, g, 0, 0.15, 0);
  box(g, 0.42, 0.55, 0.42, ironMat, 0, 4.0, 0);
  box(g, 0.32, 0.45, 0.46, WARM[3], 0, 4.0, 0); box(g, 0.46, 0.45, 0.32, WARM[3], 0, 4.0, 0);
  mesh(new THREE.ConeGeometry(0.36, 0.3, 4), ironMat, g, 0, 4.42, 0, 0, Math.PI / 4);
  mesh(new THREE.ConeGeometry(0.32, 0.22, 4), snowMat, g, 0, 4.52, 0, 0, Math.PI / 4);
  mesh(new THREE.TorusGeometry(0.26, 0.09, 6, 14), M(0x1f5a2e), g, 0, 2.9, 0.12);
  box(g, 0.16, 0.14, 0.07, M(0xc01818), 0, 2.66, 0.2);
  pool(g, 0, 0, 7, 7, 0.55, 0.36, 0.16);
  return g;
}
let lampSide = 1;
for (let z = 140; z > 30; z -= 13) {
  const l = new THREE.Group(); placeOnStreet(l, z, lampSide, 6.2); staticRoot.add(l); makeLamp(l); lampSide *= -1;
}
// garlands across the street
for (let z = 136; z > 32; z -= 11) {
  const { P, N } = frameAt(z);
  const a = P.clone().addScaledVector(N, -8.4).setY(6.2), b = P.clone().addScaledVector(N, 8.4).setY(6.2);
  const kind = Math.floor(rnd() * 3);
  garland(staticRoot, a, b, 1.3, 0.38, i => kind === 0 ? PAL.warm : kind === 1 ? multi() : (i % 2 ? PAL.gold : PAL.white), 0.07);
  if (rnd() < 0.6) garland(staticRoot, a.clone().setY(6.5), b.clone().setY(6.5), 0.5, 0.45, () => PAL.warm, 0.06);
}

// ---------- entrance arch ----------
function textTex(lines, w, h, bg) {

  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, w, h); x.strokeStyle = '#d9b15a'; x.lineWidth = 8; x.strokeRect(8, 8, w - 16, h - 16); }
  x.textAlign = 'center'; x.textBaseline = 'middle';
  lines.forEach(l => { x.font = l.font; x.fillStyle = l.color; if (l.glow) { x.shadowColor = l.glow; x.shadowBlur = 24; } x.fillText(l.text, w / 2, l.y); x.shadowBlur = 0; });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
{
  const g = new THREE.Group(); g.position.set(0, 0, 25.5); staticRoot.add(g);
  for (const s of [-1, 1]) {
    mesh(new THREE.CylinderGeometry(0.22, 0.28, 3.2, 10), woodDark, g, s * 7.2, 1.6, 0);
    mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.15, 10), snowMat, g, s * 7.2, 3.25, 0);

function updatePeople(t) {
  for (const p of people) {
    let walk = 0;
    if (p.kind === 'street') {
      const z = p.z0 + p.dir * p.v * t; const { P, N, T } = frameAt(z);
      p.g.position.copy(P).addScaledVector(N, p.lat);
      p.g.rotation.y = Math.atan2(T.x * p.dir, T.z * p.dir);
      walk = p.v * t * 3.2 + p.ph;
    } else if (p.kind === 'circle') {
      const a = p.a0 + p.dir * p.v * t / p.R;
      p.g.position.set(Math.sin(a) * p.R, 0, Math.cos(a) * p.R + TREE_Z * 0.3);
      p.g.rotation.y = a + p.dir * Math.PI / 2;
      walk = p.v * t * 3.2 + p.ph;
    }
    if (walk) {
      const s = Math.sin(walk);
      p.legs[0].rotation.x = s * 0.45; p.legs[1].rotation.x = -s * 0.45;
      p.arms[0].rotation.x = -s * 0.35; if (!p.mug) p.arms[1].rotation.x = s * 0.35;
      p.g.position.y = Math.abs(Math.cos(walk)) * 0.03 * p.g.scale.x;
    } else {
      p.head.rotation.y = Math.sin(t * 0.4 + p.ph) * 0.25;
      if (p.kid) { p.arms[1].rotation.z = 2.6 + Math.sin(t * 6 + p.ph) * 0.3; p.g.position.y = Math.max(0, Math.sin(t * 5 + p.ph)) * 0.04; }
    }
    if (p.mug) { // sip cycle
      const cyc = (t * 0.25 + p.ph) % 1; const up = smooth(0.0, 0.12, cyc) * (1 - smooth(0.32, 0.45, cyc));
      p.arms[1].rotation.x = -0.9 - up * 1.4; p.arms[1].rotation.z = 0.25 * up;
      if (p.kind === 'stand') p.head.rotation.x = -0.25 * up;
    }
  }
}

const haloMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
  vertexShader: `varying vec3 vC; void main(){ vC = color; vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv; gl_PointSize = clamp(200./-mv.z, 1., 22.); }`,
  fragmentShader: `varying vec3 vC; void main(){ float r = length(gl_PointCoord-.5)*2.; float a = exp(-r*r*6.)*0.25; gl_FragColor = vec4(vC*a, 1.); }`
});
const haloPts = new THREE.Points(haloGeo, haloMat); haloPts.frustumCulled = false; scene.add(haloPts);

// ---------- camera path ----------
const S = (z, y, dx = 0) => V3(cx(z) + dx, y, z);
const camCurve = new THREE.CatmullRomCurve3([
  S(122, 5.2), S(104, 3.7, 0.9), S(84, 4.0, -0.9), S(64, 4.3, 0.6), S(46, 4.6, 0), S(34, 4.4, 0.4),
  V3(1.2, 4.9, 25.5), V3(3.6, 6.6, 20), V3(5.0, 5.4, 16.5), V3(3.6, 4.0, 14.6), V3(1.4, 3.0, SANTA_Z + 7.6)
], false, 'centripetal', 0.5);
const camLen = camCurve.getLength();
const santaLook = V3(0, 2.2, SANTA_Z + 0.1), treeLook = V3(0, 8.5, TREE_Z);
const tmpT = V3(0, 0, 0);

// ---------- post ----------
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.7, 0.45, 1.5);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uFade: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uFade; varying vec2 vUv;
  void main(){
    vec2 uv = vUv; vec2 d = uv - .5;
    vec3 c;
    c.r = texture2D(tDiffuse, uv + d*0.0025).r; c.g = texture2D(tDiffuse, uv).g; c.b = texture2D(tDiffuse, uv - d*0.0025).b;
    float l = dot(c, vec3(.299,.587,.114));
    c = mix(c*vec3(0.9,0.97,1.1), c, smoothstep(0.0,0.45,l));
    c = mix(c, c*vec3(1.07,1.0,0.9), smoothstep(0.45,1.0,l));
    c = mix(vec3(l), c, 1.12);
    float v = smoothstep(0.95, 0.25, length(d*vec2(1.0,0.8))*1.25);
    c *= mix(0.5, 1.0, v);
    float g = fract(sin(dot(floor(uv*vec2(1920.,1080.)) + floor(uTime*30.)*vec2(17.,31.), vec2(12.9898,78.233)))*43758.5453) - .5;
    c += g*0.028;
    float bar = 0.5 - (1920./2.39/1080.)*0.5;
    float lb = step(bar, uv.y) * step(uv.y, 1.-bar);
    gl_FragColor = vec4(max(c,0.)*uFade*lb, 1.);
  }`
});
composer.addPass(finalPass);

// ---------- frame ----------
const col = new THREE.Color();
window.render = (t) => {
  const x = t / DUR;
  const f = Math.min(1, 0.9 * (1 - Math.pow(1 - x, 1.75)) + 0.1 * x);
  const p = camCurve.getPointAt(f);
  const ahead = camCurve.getPointAt(Math.min(1, f + 20 / camLen)); ahead.y -= 1.3;
  const w1 = smooth(8.5, 13.5, t), w2 = smooth(13.5, 18.8, t);
  tmpT.copy(ahead).lerp(treeLook, w1).lerp(santaLook, w2);
  camera.position.copy(p);
  camera.position.y += Math.sin(t * 0.8) * 0.06; camera.position.x += Math.sin(t * 0.53) * 0.05;
  camera.lookAt(tmpT);
  camera.rotateZ(Math.sin(t * 0.45) * 0.012 - dcx(p.z) * 0.06 * (1 - w1));
  camera.fov = 42 - 4 * smooth(13, 20, t); camera.updateProjectionMatrix();

  skyGroup.position.copy(camera.position); skyMat.uniforms.uTime.value = t;
  snowMatP.uniforms.uTime.value = t; snowMatP.uniforms.uCam.value.copy(camera.position);
  updatePeople(t);
  waveShoulder.rotation.z = 0.15 + Math.sin(t * 1.3) * 0.05;
  waveElbow.rotation.z = Math.sin(t * 5.0) * 0.38;
  santaHead.rotation.y = Math.sin(t * 0.6) * 0.12 + 0.08; santaHead.rotation.z = Math.sin(t * 5.0) * 0.03;
  for (let i = 0; i < bulbs.length; i++) {
    const b = bulbs[i]; if (!b.tw) continue;
    const k = 0.55 + 0.45 * Math.sin(t * b.tw + b.ph);
    bulbMesh.setColorAt(i, col.setRGB(b.col[0] * k, b.col[1] * k, b.col[2] * k));
  }
  bulbMesh.instanceColor.needsUpdate = true;
  for (const s of steams) {
    const u = (t * 0.35 + s.ph) % 1;
    s.sp.position.copy(s.base).add(V3(Math.sin(u * 6 + s.ph * 9) * 0.15, u * 1.6, 0));
    s.sp.scale.setScalar(0.3 + u * 0.9); s.sp.material.opacity = Math.sin(u * Math.PI) * 0.35;
  }
  finalPass.uniforms.uTime.value = t;
  finalPass.uniforms.uFade.value = smooth(0, 1.4, t) * (1 - smooth(19.2, 20, t));
  composer.render();
};
window.ready = true;
</script>
